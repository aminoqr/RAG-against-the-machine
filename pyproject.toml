[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "RAG system over the vLLM codebase"
requires-python = ">=3.10"
dependencies = [
    "fire>=0.6.0",
    "tqdm>=4.66.0",
    "pydantic>=2.0.0",
    "torch>=2.13.0",
    "transformers>=5.16.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"

[tool.mypy]
exclude = [
    "^data/",
    "^check_.*\\.py$",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
    "types-tqdm>=4.70.0.20260805",
]

[[tool.mypy.overrides]]
module = "fire"
ignore_missing_imports = true
